<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porsi — bagi uangmu</title>
<meta name="description" content="Masukkan uang yang kamu punya dan porsi tiap bagian dalam persen. Nominalnya terhitung sendiri dan langsung tergambar di pie chart.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%232a78d6'/><path d='M12 2a10 10 0 0 1 10 10H12z' fill='%23eda100'/></svg>">
<link rel="stylesheet" href="assets/css/font.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<header class="top">
  <p class="wordmark">Porsi</p>
  <button class="gear" id="open-settings" type="button" aria-label="Pengaturan">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3.5 8h11M18.5 8h2M3.5 16h5M12.5 16h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
      <circle cx="16.6" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="10.6" cy="16" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>
</header>

<main class="wrap">

  <section class="hero">
    <label class="hero__label" for="total">Uang yang kamu punya</label>
    <div class="hero__field">
      <button class="ccy" id="ccy-chip" type="button" aria-label="Ganti mata uang">
        <span class="ccy__flag" id="ccy-flag" aria-hidden="true"></span>
        <span class="ccy__code" id="ccy-code">IDR</span>
      </button>
      <span class="hero__symbol" id="symbol">Rp</span>
      <input id="total" type="text" inputmode="decimal" placeholder="0" autocomplete="off"
        aria-describedby="hero-note">
    </div>
    <p class="hero__note" id="hero-note">Ketik nominalnya — tiap porsi di bawah langsung terhitung.</p>
  </section>

  <section class="board">
    <div class="panel panel--chart">
      <div class="pie-wrap" id="pie"></div>
    </div>

    <div class="panel panel--parts">
      <div class="parts__head">
        <h2 class="parts__title">Porsi</h2>
        <span class="pctbadge" id="pct-badge">0%</span>
      </div>

      <div class="parts" id="parts"></div>

      <div class="parts__actions">
        <button class="btn btn--main" type="button" id="add">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
          Tambah porsi
        </button>
        <button class="btn" type="button" id="even">Bagi rata</button>
        <button class="btn" type="button" id="fit">Paskan 100%</button>
      </div>
    </div>
  </section>
</main>

<div class="sheet" id="settings" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="settings-h">
    <div class="sheet__head">
      <h2 id="settings-h">Pengaturan</h2>
      <button class="gear gear--sm" type="button" data-close aria-label="Tutup">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>

    <div class="sheet__group">
      <h3>Mata uang</h3>
      <div class="ccyopts" id="ccy-options" role="radiogroup" aria-label="Mata uang"></div>
      <p class="sheet__note">Mengganti mata uang hanya mengubah simbol dan format angkanya — nominal yang sudah kamu ketik tidak dikonversi.</p>
    </div>

    <div class="sheet__group">
      <h3>Tampilan</h3>
      <button class="rowbtn" type="button" id="theme-toggle">
        <span id="theme-label">Tema gelap</span>
        <span class="rowbtn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
          <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.4A8.6 8.6 0 0 1 9.6 4a8.6 8.6 0 1 0 10.4 10.4Z" fill="currentColor"/></svg>
        </span>
      </button>
    </div>

    <div class="sheet__group">
      <h3>Data</h3>
      <button class="rowbtn rowbtn--danger" type="button" id="reset">Hapus semua &amp; mulai lagi</button>
      <p class="sheet__note">Semua isian tersimpan di browser ini saja.</p>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
